<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 368" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F8F8F2"/>
    </marker>
  </defs>
  <style>
    .heading { fill: #F8F8F2; font-size: 21px; font-weight: 600; }
    .dir { fill: #282A36; stroke: #8BE9FD; stroke-width: 1.6; }
    .object { fill: #282A36; stroke: #50FA7B; stroke-width: 1.6; }
    .hash { fill: #282A36; stroke: #BD93F9; stroke-width: 1.6; }
    .mono { fill: #F8F8F2; font-size: 15px; font-family: ui-monospace, "JetBrains Mono", monospace; }
    .edge { stroke: #F8F8F2; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .muted { fill: #A4A9C2; font-size: 20px; }
    .bad { fill: #FFB86C; font-size: 19px; font-weight: 600; }
    .good { fill: #50FA7B; font-size: 19px; font-weight: 600; }
  </style>

  <rect width="960" height="368" rx="16" fill="#1e1f29"/>
  <path d="M480 28 L480 340" stroke="#44475A" stroke-width="1.6"/>

  <!-- Before -->
  <text class="heading" x="32" y="52">Before: one object per directory</text>

  <rect class="dir" x="32" y="80" width="190" height="36" rx="8"/>
  <text class="mono" x="46" y="103">/</text>
  <rect class="dir" x="32" y="128" width="190" height="36" rx="8"/>
  <text class="mono" x="46" y="151">/usr</text>
  <rect class="dir" x="32" y="176" width="190" height="36" rx="8"/>
  <text class="mono" x="46" y="199">/usr/lib</text>
  <rect class="dir" x="32" y="224" width="190" height="36" rx="8"/>
  <text class="mono" x="46" y="247">/app/node_modules</text>
  <text class="muted" x="120" y="290" text-anchor="middle">…</text>

  <rect class="object" x="292" y="80" width="160" height="36" rx="8"/>
  <text class="mono" x="372" y="103" text-anchor="middle">R2 object</text>
  <rect class="object" x="292" y="128" width="160" height="36" rx="8"/>
  <text class="mono" x="372" y="151" text-anchor="middle">R2 object</text>
  <rect class="object" x="292" y="176" width="160" height="36" rx="8"/>
  <text class="mono" x="372" y="199" text-anchor="middle">R2 object</text>
  <rect class="object" x="292" y="224" width="160" height="36" rx="8"/>
  <text class="mono" x="372" y="247" text-anchor="middle">R2 object</text>
  <text class="muted" x="372" y="290" text-anchor="middle">…</text>

  <path class="edge" d="M222 98 L290 98"/>
  <path class="edge" d="M222 146 L290 146"/>
  <path class="edge" d="M222 194 L290 194"/>
  <path class="edge" d="M222 242 L290 242"/>

  <text class="bad" x="32" y="336">3,573 directories = 3,573 R2 writes</text>

  <!-- After -->
  <text class="heading" x="512" y="52">After: 128 shards</text>

  <rect class="dir" x="512" y="80" width="170" height="36" rx="8"/>
  <text class="mono" x="526" y="103">/</text>
  <rect class="dir" x="512" y="128" width="170" height="36" rx="8"/>
  <text class="mono" x="526" y="151">/usr</text>
  <rect class="dir" x="512" y="176" width="170" height="36" rx="8"/>
  <text class="mono" x="526" y="199">/usr/lib</text>
  <rect class="dir" x="512" y="224" width="170" height="36" rx="8"/>
  <text class="mono" x="526" y="247">/app/node_m…</text>
  <text class="muted" x="597" y="290" text-anchor="middle">…</text>

  <rect class="hash" x="712" y="138" width="96" height="64" rx="8"/>
  <text class="mono" x="760" y="164" text-anchor="middle">hash</text>
  <text class="mono" x="760" y="186" text-anchor="middle">% 128</text>

  <path class="edge" d="M682 98 L710 156"/>
  <path class="edge" d="M682 146 L710 164"/>
  <path class="edge" d="M682 194 L710 176"/>
  <path class="edge" d="M682 242 L710 186"/>

  <rect class="object" x="840" y="80" width="96" height="36" rx="8"/>
  <text class="mono" x="888" y="103" text-anchor="middle">shard 0</text>
  <rect class="object" x="840" y="128" width="96" height="36" rx="8"/>
  <text class="mono" x="888" y="151" text-anchor="middle">shard 1</text>
  <text class="muted" x="888" y="200" text-anchor="middle">…</text>
  <rect class="object" x="840" y="224" width="96" height="36" rx="8"/>
  <text class="mono" x="888" y="247" text-anchor="middle">shard 127</text>

  <path class="edge" d="M808 160 L838 98"/>
  <path class="edge" d="M808 168 L838 146"/>
  <path class="edge" d="M808 180 L838 242"/>

  <text class="good" x="512" y="336">3,573 directories = 128 R2 writes</text>
</svg>
