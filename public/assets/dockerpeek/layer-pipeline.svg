<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Inter, ui-sans-serif, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#F8F8F2"/>
    </marker>
  </defs>
  <style>
    .box { fill: #282A36; stroke-width: 2; }
    .title { fill: #F8F8F2; font-size: 21px; font-weight: 600; text-anchor: middle; }
    .sub { fill: #A4A9C2; font-size: 15px; font-family: ui-monospace, "JetBrains Mono", monospace; text-anchor: middle; }
    .edge { stroke: #F8F8F2; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .note { fill: #A4A9C2; font-size: 16px; }
  </style>

  <rect width="960" height="300" rx="16" fill="#1e1f29"/>

  <rect class="box" x="16" y="40" width="164" height="80" rx="12" stroke="#FFB86C"/>
  <text class="title" x="98" y="75">Registry blob</text>
  <text class="sub" x="98" y="100">compressed</text>

  <rect class="box" x="204" y="40" width="164" height="80" rx="12" stroke="#BD93F9"/>
  <text class="title" x="286" y="75">Verify</text>
  <text class="sub" x="286" y="100">sha256</text>

  <rect class="box" x="392" y="40" width="164" height="80" rx="12" stroke="#BD93F9"/>
  <text class="title" x="474" y="75">Decompress</text>
  <text class="sub" x="474" y="100">gzip, zstd</text>

  <rect class="box" x="580" y="40" width="164" height="80" rx="12" stroke="#BD93F9"/>
  <text class="title" x="662" y="75">Tar parser</text>
  <text class="sub" x="662" y="100">reads headers</text>

  <rect class="box" x="768" y="40" width="176" height="80" rx="12" stroke="#BD93F9"/>
  <text class="title" x="856" y="75">Upload</text>
  <text class="sub" x="856" y="100">8 MiB parts</text>

  <rect class="box" x="568" y="196" width="188" height="80" rx="12" stroke="#50FA7B"/>
  <text class="title" x="662" y="231">index.json</text>
  <text class="sub" x="662" y="256">path, size, offset</text>

  <rect class="box" x="762" y="196" width="188" height="80" rx="12" stroke="#50FA7B"/>
  <text class="title" x="856" y="231">layer.tar</text>
  <text class="sub" x="856" y="256">decompressed</text>

  <path class="edge" d="M180 80 L202 80"/>
  <path class="edge" d="M368 80 L390 80"/>
  <path class="edge" d="M556 80 L578 80"/>
  <path class="edge" d="M744 80 L766 80"/>
  <path class="edge" d="M662 120 L662 194"/>
  <path class="edge" d="M856 120 L856 194"/>

  <text class="note" x="550" y="242" text-anchor="end" style="fill: #50FA7B">Saved to R2</text>
</svg>
